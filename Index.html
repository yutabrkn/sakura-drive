
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>Sakura Drive 🌸</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10152b;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#15153b,#6b397b,#f18ba9)}
#intro{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#100d2bea,#38234bea),radial-gradient(circle at center,#9b5ab8,transparent 65%)}
h1{font-size:clamp(42px,12vw,68px);margin:0;text-shadow:0 0 25px #ff85d0;letter-spacing:3px}
.sub{color:#f6cde9;letter-spacing:4px;margin:12px 0 35px}
button{border:1px solid #ffffff66;border-radius:15px;background:#ffffff18;color:white;font-size:18px;font-weight:bold;padding:15px 28px;cursor:pointer}
button:active{transform:scale(.96)}
#mapScreen{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:#11152af2;gap:14px}
#maps{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,370px)}
.map{min-height:95px;border-radius:14px;background:linear-gradient(145deg,#514477,#c56d9c);display:flex;flex-direction:column;justify-content:center;gap:7px}
.map.selected{border:2px solid #8df5c3;box-shadow:0 0 15px #8df5c355}
#drive{position:absolute;inset:0;display:none;overflow:hidden}
#sky{position:absolute;inset:0 0 38% 0;background:linear-gradient(#191a4c,#b66a9a)}
#sun{position:absolute;width:100px;height:100px;border-radius:50%;background:#ffc2d7;top:16%;left:calc(50% - 50px);box-shadow:0 0 45px #ffb4dc}
#buildings{position:absolute;bottom:38%;left:0;width:100%;height:25%;display:flex;align-items:end;justify-content:space-around}
.building{width:12%;background:#29233f;border:1px solid #584a70;height:70%;position:relative}
.building:nth-child(2n){height:100%}
.building:after{content:"";position:absolute;inset:10px 5px;background:repeating-linear-gradient(0deg,#ffcf8c 0 4px,transparent 4px 13px);opacity:.55}
#road{position:absolute;bottom:0;left:10%;width:80%;height:65%;background:#272633;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
#roadLines{position:absolute;inset:0;overflow:hidden}
.roadline{position:absolute;left:49%;width:2%;height:12%;background:#f8e7bb;transform:translateX(-50%);animation:roadmove .8s linear infinite}
@keyframes roadmove{from{top:-15%}to{top:110%}}
#car{position:absolute;bottom:13%;left:calc(50% - 32px);width:64px;height:105px;border-radius:18px 18px 10px 10px;background:linear-gradient(90deg,#8c193e,#f15c82,#a51d48);border:2px solid #ff9cb7;box-shadow:0 0 20px #ff649b88}
#car:before{content:"";position:absolute;top:20px;left:10px;width:40px;height:27px;border-radius:8px;background:#263a58;border:2px solid #8da6c6}
#car:after{content:"";position:absolute;bottom:7px;left:7px;width:46px;height:8px;background:#ffdfb0;box-shadow:0 -70px 10px -3px #ffdbb0}
#hud{position:absolute;top:18px;left:15px;right:15px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 5px #000}
#controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-evenly}
.control{width:90px;height:65px;background:#111827bb;font-size:30px}
#back{position:absolute;top:55px;left:15px;font-size:14px;padding:10px}
</style>
</head>
<body>
<div id="game">
  <div id="intro">
    <div style="font-size:55px">🌸</div>
    <h1>SAKURA<br>DRIVE</h1>
    <div class="sub">JAPANESE CITY CRUISING</div>
    <button id="begin">START ENGINE 🚗</button>
    <p style="color:#d8c5e9;font-size:12px;margin-top:20px">A peaceful journey through Japan</p>
  </div>
  <div id="mapScreen">
    <h2>CHOOSE YOUR MAP 🌸</h2>
    <p style="color:#d8c5e9;margin:0 0 10px">Where shall we drive today?</p>
    <div id="maps">
      <button class="map selected" data-map="0">🌃<span>TOKYO NEON</span></button>
      <button class="map" data-map="1">🌸<span>SAKURA ROAD</span></button>
      <button class="map" data-map="2">🌅<span>COASTAL DRIVE</span></button>
      <button class="map" data-map="3">🏮<span>KYOTO RAIN</span></button>
      <button class="map" data-map="4">🏔️<span>MOUNTAIN DRIVE</span></button>
    </div>
    <button id="startDrive">START DRIVE 🚗</button>
  </div>
  <div id="drive">
    <div id="sky"><div id="sun"></div></div>
    <div id="buildings"></div>
    <div id="road"><div id="roadLines"></div></div>
    <div id="car"></div>
    <div id="hud"><span>🌸 SAKURA DRIVE</span><span id="score">0 m</span></div>
    <button id="back">← MAPS</button>
    <div id="controls">
      <button class="control" id="left">◀</button>
      <button class="control" id="right">▶</button>
    </div>
  </div>
</div>
<script>
const intro=document.getElementById("intro"),mapScreen=document.getElementById("mapScreen"),drive=document.getElementById("drive");
const mapButtons=[...document.querySelectorAll(".map")];
let selected=0,lane=1,distance=0,playing=false,audio;
const themes=[
 ["linear-gradient(#191a4c,#b66a9a)","#272633"],
 ["linear-gradient(#e9a9ca,#f9dce7,#8dc4e8)","#45404a"],
 ["linear-gradient(#f6a04d,#e96b83,#514a87)","#393943"],
 ["linear-gradient(#101b32,#34445e,#6b7184)","#252c39"],
 ["linear-gradient(#a8d8d1,#77a9a4,#456f75)","#343d40"]
];
function engineSound(){
 try{
  audio=new(window.AudioContext||window.webkitAudioContext)();
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type="sawtooth";osc.frequency.setValueAtTime(65,audio.currentTime);
  osc.frequency.exponentialRampToValueAtTime(115,audio.currentTime+.7);
  gain.gain.setValueAtTime(.001,audio.currentTime);
  gain.gain.linearRampToValueAtTime(.12,audio.currentTime+.12);
  gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+1.5);
  osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+1.6);
 }catch(e){}
}
document.getElementById("begin").onclick=()=>{
 engineSound();intro.style.display="none";mapScreen.style.display="flex";
};
mapButtons.forEach((b,i)=>b.onclick=()=>{
 selected=i;mapButtons.forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
});
function move(dir){
 lane=Math.max(0,Math.min(2,lane+dir));
 document.getElementById("car").style.left=`calc(${25+lane*25}% - 32px)`;
}
document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.getElementById("startDrive").onclick=()=>{
 drive.style.display="block";mapScreen.style.display="none";
 document.getElementById("sky").style.background=themes[selected][0];
 document.getElementById("road").style.background=themes[selected][1];
 lane=1;distance=0;playing=true;last=performance.now();requestAnimationFrame(tick);
};
document.getElementById("back").onclick=()=>{
 playing=false;drive.style.display="none";mapScreen.style.display="flex";
};
let last=0;
function tick(t){
 if(!playing)return;
 if(t-last>100){distance++;document.getElementById("score").textContent=distance+" m";last=t;}
 requestAnimationFrame(tick);
}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
});
</script>
</body>
</html>
